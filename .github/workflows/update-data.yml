name: Update data

on:
  schedule:
    - cron: "17 12 * * *"   # every day, 12:17 UTC (5:17 AM Arizona)
  workflow_dispatch:         # lets you click "Run workflow" by hand
  push:
    paths:
      - "data/promises.json"
      - "data/statements.json"
      - "data/committee_sectors.json"
      - "data/name_overrides.json"
      - "inbox/**"
      - "data/races.json"
      - "data/issues.json"

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Import Grok research from inbox/
        run: python scripts/import_grok.py

      - name: Check promises and statements
        run: python scripts/validate_entries.py

      - name: Senator roster
        if: github.event_name != 'push'
        run: python scripts/fetch_roster.py

      - name: Senate votes
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: python scripts/fetch_votes.py

      # Paused: efdsearch.senate.gov blocks automated downloads from GitHub's servers.
      - name: Stock trades
        if: false
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/fetch_trades.py

      - name: Campaign money
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scripts/fetch_money.py

      - name: Election candidates
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scripts/fetch_candidates.py

      - name: Build site data
        run: python scripts/build_site_data.py

      - name: Commit changes
        run: |
          git config user.name "on-the-record-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data inbox
          git diff --cached --quiet && exit 0
          git commit -m "Data update $(date -u +%Y-%m-%d)"
          # Another run may have pushed meanwhile: rebuild on top of it rather than fail.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
