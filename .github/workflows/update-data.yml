name: Update data

on:
  schedule:
    - cron: "17 12 * * *"   # every day, 12:17 UTC (5:17 AM Arizona)
  workflow_dispatch:         # lets you click "Run workflow" by hand
  push:
    paths:
      - "data/promises.json"
      - "data/statements.json"
      - "data/committee_sectors.json"
      - "data/name_overrides.json"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Check promises and statements
        run: python scripts/validate_entries.py

      - name: Senator roster
        if: github.event_name != 'push'
        run: python scripts/fetch_roster.py

      - name: Senate votes
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: python scripts/fetch_votes.py

      - name: Stock trades
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/fetch_trades.py

      - name: Campaign money
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scripts/fetch_money.py

      - name: Build site data
        run: python scripts/build_site_data.py

      - name: Commit changes
        run: |
          git config user.name "on-the-record-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push
