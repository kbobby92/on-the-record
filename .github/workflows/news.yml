name: Update news

on:
  schedule:
    # 6 AM, 10 AM, 2 PM and 6 PM Arizona time (UTC-7, no daylight saving) = 13, 17, 21, 01 UTC
    - cron: "7 13,17,21,1 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/news_sources.json"
      - "scripts/fetch_news.py"

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 feedparser==6.0.11

      - name: Collect news
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: python scripts/fetch_news.py

      - name: Commit changes
        run: |
          git config user.name "on-the-record-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet && exit 0
          git commit -m "News update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
